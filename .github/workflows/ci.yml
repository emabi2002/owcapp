name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Lint and type-check
        run: bun run lint
      - name: Build
        run: bun run build
