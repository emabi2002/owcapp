name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Type-check and lint
        run: bun run lint
      - name: Build
        run: bun run build
